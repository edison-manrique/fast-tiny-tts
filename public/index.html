<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>fast-tiny-tts · Studio Fullscreen</title>
  <meta name="description" content="Ultra-compact English TTS running locally via Bun or client-side via ONNX Runtime Web" />
  <meta name="theme-color" content="#07080d" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%237c5cff'/%3E%3Cstop offset='100%25' stop-color='%2306b6d4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M12 9l11 7-11 7V9z' fill='%23ffffff'/%3E%3Ccircle cx='24' cy='9' r='2.5' fill='%2310b981'/%3E%3C/svg%3E" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.svg" />

  <!-- Import map for bare specifiers -->
  <script type="importmap">
  {
    "imports": {
      "onnxruntime-web": "/dist/onnxruntime-web/ort.all.min.mjs"
    }
  }
  </script>

  <!-- Service Worker registration -->
  <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').then(reg => {
        console.log('[SW] Registered:', reg.scope);
      }).catch(err => console.warn('[SW] Registration failed:', err));
    });
  }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #07080d;
      --bg-surface: #0e111a;
      --bg-card: rgba(16, 20, 32, 0.75);
      --bg-card-hover: rgba(22, 28, 44, 0.85);
      --border: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(124, 92, 255, 0.5);
      --border-hover: rgba(255, 255, 255, 0.16);
      --fg: #f4f5f8;
      --fg-muted: #8b92a5;
      --fg-subtle: #565d70;
      --primary: #7c5cff;
      --primary-light: #9a82ff;
      --primary-glow: rgba(124, 92, 255, 0.28);
      --secondary: #06b6d4;
      --secondary-glow: rgba(6, 182, 212, 0.25);
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.25);
      --danger: #f43f5e;
      --radius: 12px;
      --radius-sm: 8px;
      --radius-xs: 5px;
      --shadow: 0 16px 40px -10px rgba(0, 0, 0, 0.5);
      --transition: 160ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    *::selection { background: var(--primary); color: #fff; }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
    }

    /* Ambient Background Glow */
    .aurora-bg {
      position: fixed;
      inset: -30%;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(circle at 15% 20%, rgba(124, 92, 255, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(6, 182, 212, 0.1) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(16, 185, 129, 0.05) 0%, transparent 50%);
      filter: blur(50px);
    }

    .grid-pattern {
      position: fixed;
      inset: 0;
      z-index: -1;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
    }

    /* Topbar Header (Compact 46px) */
    header {
      height: 46px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      border-bottom: 1px solid var(--border);
      background: rgba(7, 8, 13, 0.85);
      backdrop-filter: blur(16px);
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--fg);
    }

    .brand-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      display: grid;
      place-items: center;
      box-shadow: 0 2px 10px var(--primary-glow);
    }

    .brand-icon svg { width: 15px; height: 15px; fill: white; }

    .brand-title {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .brand-tag {
      font-size: 0.62rem;
      font-weight: 700;
      background: rgba(124, 92, 255, 0.15);
      color: var(--primary-light);
      border: 1px solid rgba(124, 92, 255, 0.3);
      padding: 1px 6px;
      border-radius: 999px;
      letter-spacing: 0.04em;
    }

    /* Engine Switcher */
    .engine-switcher {
      display: flex;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 2px;
      gap: 2px;
    }

    .engine-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 5px 12px;
      border-radius: 999px;
      border: none;
      background: transparent;
      color: var(--fg-muted);
      font-family: inherit;
      font-size: 0.74rem;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition);
      white-space: nowrap;
    }

    .engine-btn:hover:not(.active) {
      color: var(--fg);
      background: rgba(255, 255, 255, 0.05);
    }

    .engine-btn.active {
      background: linear-gradient(135deg, var(--primary) 0%, #6340f0 100%);
      color: #fff;
      box-shadow: 0 2px 8px var(--primary-glow);
    }

    .engine-btn.active.web {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      box-shadow: 0 2px 8px var(--secondary-glow);
    }

    /* Status Badge */
    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(18, 22, 34, 0.8);
      border: 1px solid var(--border);
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--fg-muted);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }

    .status-badge.loading .status-dot {
      background: #f59e0b;
      box-shadow: 0 0 8px #f59e0b;
      animation: pulse 1.2s infinite ease-in-out;
    }

    .status-badge.error .status-dot {
      background: var(--danger);
      box-shadow: 0 0 8px var(--danger);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    /* Main Studio Container: 100vh Layout (Split Studio Grid) */
    .studio-viewport {
      flex: 1;
      width: 100vw;
      height: calc(100vh - 46px);
      padding: 10px 14px;
      display: grid;
      grid-template-columns: minmax(350px, 1.15fr) minmax(360px, 1fr);
      gap: 12px;
      overflow: hidden;
    }

    /* Studio Columns */
    .studio-col {
      display: flex;
      flex-direction: column;
      height: 100%;
      gap: 10px;
      overflow: hidden;
    }

    .studio-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .card-editor {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .card-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .card-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--fg-subtle);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .input-stats {
      font-size: 0.7rem;
      color: var(--fg-subtle);
      font-family: 'JetBrains Mono', monospace;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-clear {
      background: transparent;
      border: none;
      color: var(--fg-subtle);
      cursor: pointer;
      font-size: 0.7rem;
      transition: color var(--transition);
    }
    .btn-clear:hover { color: var(--fg); }

    /* Textarea */
    .textarea-box {
      flex: 1;
      min-height: 90px;
      position: relative;
      display: flex;
    }

    textarea {
      width: 100%;
      height: 100%;
      resize: none;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--fg);
      padding: 10px 14px;
      font-family: inherit;
      font-size: 0.88rem;
      line-height: 1.6;
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
    }

    textarea:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 2px var(--primary-glow);
    }

    textarea::placeholder { color: var(--fg-subtle); opacity: 0.8; }

    /* Quick Presets Row */
    .presets-row {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
      flex-shrink: 0;
    }
    .presets-row::-webkit-scrollbar { height: 4px; }
    .presets-row::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .preset-pill {
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      color: var(--fg-muted);
      font-size: 0.72rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all var(--transition);
      flex-shrink: 0;
    }

    .preset-pill:hover {
      background: rgba(124, 92, 255, 0.12);
      border-color: rgba(124, 92, 255, 0.4);
      color: var(--fg);
    }

    /* Voice & Acoustic Modulation Grid */
    .modulation-grid {
      display: grid;
      grid-template-columns: 140px 1fr;
      gap: 10px;
      flex-shrink: 0;
    }

    .voice-select-box {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .voice-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
      height: 100%;
    }

    .voice-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding: 6px 4px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      color: var(--fg-muted);
      transition: all var(--transition);
    }

    .voice-btn:hover { background: rgba(255, 255, 255, 0.06); color: var(--fg); }
    .voice-btn.active {
      background: rgba(124, 92, 255, 0.18);
      border-color: var(--primary);
      color: #fff;
      box-shadow: 0 0 10px var(--primary-glow);
    }

    .voice-btn-name { font-size: 0.85rem; font-weight: 700; }
    .voice-btn-sub { font-size: 0.6rem; color: var(--fg-subtle); }
    .voice-btn.active .voice-btn-sub { color: var(--primary-light); }

    /* Sliders Strip */
    .sliders-box {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 7px 10px;
    }

    .slider-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .slider-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.65rem;
      font-weight: 600;
      color: var(--fg-subtle);
    }

    .slider-val {
      font-family: 'JetBrains Mono', monospace;
      color: var(--primary-light);
      font-weight: 700;
    }

    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      outline: none;
      cursor: pointer;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      cursor: pointer;
      box-shadow: 0 1px 6px var(--primary-glow);
    }

    /* Primary Generate Button (Always Visible) */
    .btn-generate {
      width: 100%;
      height: 42px;
      flex-shrink: 0;
      border: none;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--primary) 0%, #6340f0 100%);
      color: #fff;
      font-family: inherit;
      font-size: 0.92rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      cursor: pointer;
      transition: all var(--transition);
      box-shadow: 0 6px 18px var(--primary-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      position: relative;
      overflow: hidden;
    }

    .btn-generate:hover:not(:disabled) {
      box-shadow: 0 8px 24px var(--primary-glow);
      transform: translateY(-1px);
    }

    .btn-generate:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      background: rgba(255, 255, 255, 0.08);
      box-shadow: none;
    }

    .kbd-shortcut {
      font-size: 0.65rem;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 3px;
      padding: 1px 5px;
      font-family: 'JetBrains Mono', monospace;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Right Column: Audio Studio & Monitor */
    .card-player {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      height: 100%;
    }

    .player-meta-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .badge-pill {
      font-size: 0.68rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 5px;
    }

    .badge-voice {
      background: rgba(124, 92, 255, 0.15);
      color: var(--primary-light);
      border: 1px solid rgba(124, 92, 255, 0.3);
    }

    .badge-engine {
      background: rgba(6, 182, 212, 0.12);
      color: #38bdf8;
      border: 1px solid rgba(6, 182, 212, 0.3);
      margin-left: 5px;
    }

    /* Waveform Canvas */
    .waveform-wrap {
      flex: 1;
      min-height: 90px;
      position: relative;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
      cursor: pointer;
    }

    canvas#waveCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .waveform-cursor {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 0%;
      background: rgba(124, 92, 255, 0.12);
      border-right: 2px solid var(--primary-light);
      pointer-events: none;
      transition: width 50ms linear;
    }

    /* Playback Controls Row */
    .playback-strip {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      flex-shrink: 0;
    }

    .btn-play {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--primary) 0%, #6340f0 100%);
      color: #fff;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: all var(--transition);
      box-shadow: 0 2px 10px var(--primary-glow);
    }

    .btn-play:hover { transform: scale(1.06); }
    .btn-play svg { width: 16px; height: 16px; fill: currentColor; }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--fg-muted);
      border-radius: 6px;
      padding: 6px 8px;
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    .btn-secondary:hover { background: rgba(255, 255, 255, 0.05); color: var(--fg); }
    .btn-secondary svg { width: 14px; height: 14px; stroke: currentColor; }

    .time-readout {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--fg);
      font-variant-numeric: tabular-nums;
    }

    .btn-download-wav {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      border-radius: var(--radius-xs);
      color: var(--fg);
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition);
    }

    .btn-download-wav:hover {
      background: rgba(124, 92, 255, 0.15);
      border-color: var(--primary);
      color: var(--primary-light);
    }

    /* Metrics Grid (Compact) */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      flex-shrink: 0;
    }

    .metric-cell {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--border);
      border-radius: var(--radius-xs);
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .m-lbl {
      font-size: 0.58rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--fg-subtle);
      font-weight: 600;
    }

    .m-val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--fg);
    }

    .m-val.green { color: var(--accent); }
    .m-val.cyan { color: var(--secondary); }

    /* Info Bar at Bottom of Col 2 */
    .engine-footer-note {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px;
      background: rgba(0, 0, 0, 0.2);
      border: 1px dashed var(--border);
      border-radius: var(--radius-xs);
      font-size: 0.7rem;
      color: var(--fg-muted);
      flex-shrink: 0;
    }

    /* Hidden native audio */
    audio#nativeAudio { display: none; }

    /* Toast Notification */
    #toast {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      z-index: 1000;
      padding: 8px 16px;
      background: rgba(20, 24, 38, 0.95);
      border: 1px solid var(--border);
      border-radius: 999px;
      backdrop-filter: blur(16px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      color: var(--fg);
      font-size: 0.78rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.2, 1);
      pointer-events: none;
    }

    #toast.show { transform: translateX(-50%) translateY(0); }
    #toast.success { border-color: rgba(16, 185, 129, 0.4); }
    #toast.info { border-color: rgba(6, 182, 212, 0.4); }
    #toast.danger { border-color: rgba(244, 63, 94, 0.4); }

    #toast .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent);
    }
    #toast.info .dot { background: var(--secondary); box-shadow: 0 0 6px var(--secondary); }
    #toast.danger .dot { background: var(--danger); box-shadow: 0 0 6px var(--danger); }

    /* Responsive for small screens / mobile */
    @media (max-width: 768px) {
      html, body { overflow-y: auto; height: auto; }
      .studio-viewport {
        grid-template-columns: 1fr;
        height: auto;
        overflow: visible;
        padding: 10px;
      }
      .studio-col { height: auto; overflow: visible; }
      .card-editor { height: auto; }
      .card-player { height: auto; }
      .textarea-box { min-height: 110px; }
      .metrics-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <div class="aurora-bg"></div>
  <div class="grid-pattern"></div>

  <!-- Topbar (46px) -->
  <header>
    <a href="/" class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z"/></svg>
      </div>
      <div class="brand-title">
        fast-tiny-tts
        <span class="brand-tag">24 kHz</span>
      </div>
    </a>

    <!-- Engine Mode Toggle -->
    <div class="engine-switcher">

  <script type="module">
    import { TinyVoca, encodeWav } from '/dist/web/tiny-voca.js';

    // State
    const state = {
      mode: 'bun', // 'bun' | 'web'
      voice: 'F2',
      speed: 1.0,
      pitchShift: 0.0,
      pitchRange: 1.0,
      isSynthesizing: false,
      isPlaying: false,
      bunAvailable: false,
      webTtsInstance: null,
      webLoading: false,
      audioBuffer: null,
      audioUrl: null,
      audioSamples: null,
      duration: 0,
      startTime: 0,
      pauseOffset: 0,
    };

    // DOM Elements
    const els = {
      btnModeBun: document.getElementById('btnModeBun'),
      btnModeWeb: document.getElementById('btnModeWeb'),
      statusBadge: document.getElementById('statusBadge'),
      statusText: document.getElementById('statusText'),
      activeEngineDesc: document.getElementById('activeEngineDesc'),
      textInput: document.getElementById('textInput'),
      charCount: document.getElementById('charCount'),
      wordCount: document.getElementById('wordCount'),
      btnClear: document.getElementById('btnClear'),
      voiceF2: document.getElementById('voiceF2'),
      voiceM2: document.getElementById('voiceM2'),
      sliderSpeed: document.getElementById('sliderSpeed'),
      speedVal: document.getElementById('speedVal'),
      sliderPitch: document.getElementById('sliderPitch'),
      pitchVal: document.getElementById('pitchVal'),
      sliderRange: document.getElementById('sliderRange'),
      rangeVal: document.getElementById('rangeVal'),
      btnGenerate: document.getElementById('btnGenerate'),
      btnLabel: document.getElementById('btnLabel'),
      btnIcon: document.getElementById('btnIcon'),
      btnSpinner: document.getElementById('btnSpinner'),
      waveCanvas: document.getElementById('waveCanvas'),
      waveformBox: document.getElementById('waveformBox'),
      waveformCursor: document.getElementById('waveformCursor'),
      btnPlayPause: document.getElementById('btnPlayPause'),
      playIcon: document.getElementById('playIcon'),
      pauseIcon: document.getElementById('pauseIcon'),
      btnStop: document.getElementById('btnStop'),
      btnDownload: document.getElementById('btnDownload'),
      timeCurrent: document.getElementById('timeCurrent'),
      timeTotal: document.getElementById('timeTotal'),
      tagVoice: document.getElementById('tagVoice'),
      tagEngine: document.getElementById('tagEngine'),
      audioSummary: document.getElementById('audioSummary'),
      mInference: document.getElementById('mInference'),
      mRTF: document.getElementById('mRTF'),
      mDuration: document.getElementById('mDuration'),
      mTokens: document.getElementById('mTokens'),
      nativeAudio: document.getElementById('nativeAudio'),
      toast: document.getElementById('toast'),
      toastMsg: document.getElementById('toastMsg'),
    };

    let audioCtx = null;
    let audioSourceNode = null;
    let analyserNode = null;
    let animFrameId = null;

    function getAudioContext() {
      if (!audioCtx) {
        const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioCtxClass();
        analyserNode = audioCtx.createAnalyser();
        analyserNode.fftSize = 1024;
        analyserNode.smoothingTimeConstant = 0.75;
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    let toastTimer = null;
    function showToast(msg, type = 'info') {
      if (toastTimer) clearTimeout(toastTimer);
      els.toastMsg.textContent = msg;
      els.toast.className = type + ' show';
      toastTimer = setTimeout(() => {
        els.toast.classList.remove('show');
      }, 2600);
    }

    function fmtTime(sec) {
      if (isNaN(sec) || sec < 0) sec = 0;
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      const ds = Math.floor((sec % 1) * 10);
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}.${ds}`;
    }

    function updateTextCounters() {
      const text = els.textInput.value;
      els.charCount.textContent = `${text.length} c`;
      const words = text.trim() ? text.trim().split(/\s+/).length : 0;
      els.wordCount.textContent = `${words} p`;
    }

    els.textInput.addEventListener('input', updateTextCounters);
    updateTextCounters();

    els.btnClear.onclick = () => {
      els.textInput.value = '';
      els.textInput.focus();
      updateTextCounters();
    };

    // Preset pills
    document.querySelectorAll('.preset-pill').forEach(pill => {
      pill.onclick = () => {
        els.textInput.value = pill.dataset.t;
        updateTextCounters();
        showToast('Ejemplo cargado', 'info');
      };
    });

    // Voice switching
    function setVoice(v) {
      state.voice = v;
      els.voiceF2.classList.toggle('active', v === 'F2');
      els.voiceM2.classList.toggle('active', v === 'M2');
      els.tagVoice.textContent = v;
    }

    els.voiceF2.onclick = () => setVoice('F2');
    els.voiceM2.onclick = () => setVoice('M2');

    // Sliders
    els.sliderSpeed.oninput = () => {
      state.speed = parseFloat(els.sliderSpeed.value);
      els.speedVal.textContent = `${state.speed.toFixed(2)}×`;
    };

    els.sliderPitch.oninput = () => {
      state.pitchShift = parseFloat(els.sliderPitch.value);
      els.pitchVal.textContent = state.pitchShift > 0 ? `+${state.pitchShift.toFixed(1)}` : state.pitchShift.toFixed(1);
    };

    els.sliderRange.oninput = () => {
      state.pitchRange = parseFloat(els.sliderRange.value);
      els.rangeVal.textContent = state.pitchRange.toFixed(1);
    };

    // Engine switcher
    function setEngineMode(mode) {
      state.mode = mode;
      els.btnModeBun.classList.toggle('active', mode === 'bun');
      els.btnModeWeb.classList.toggle('active', mode === 'web');

      if (mode === 'bun') {
        els.activeEngineDesc.textContent = '⚡ Inferencia nativa acelerada (Bun/Node)';
        els.statusText.textContent = state.bunAvailable ? 'Bun Conectado' : 'Comprobando Bun…';
        els.tagEngine.textContent = '⚡ Bun API';
        showToast('Modo Servidor Bun activado', 'info');
      } else {
        els.activeEngineDesc.textContent = '🌐 Inferencia 100% en el cliente (ONNX WebAssembly)';
        els.statusText.textContent = state.webTtsInstance ? 'Web Listo' : 'Web (Cliente)';
        els.tagEngine.textContent = '🌐 Web ONNX';
        showToast('Modo Web (Cliente) activado', 'info');
        initWebEngineIfNeeded();
      }
    }

    els.btnModeBun.onclick = () => setEngineMode('bun');
    els.btnModeWeb.onclick = () => setEngineMode('web');

    // Check Bun availability
    async function checkBunServer() {
      try {
        const res = await fetch('/api/voices', { method: 'GET', signal: AbortSignal.timeout(1800) });
        if (res.ok) {
          state.bunAvailable = true;
          els.statusBadge.className = 'status-badge';
          if (state.mode === 'bun') els.statusText.textContent = 'Bun Listo';
          return true;
        }
      } catch (e) {}
      state.bunAvailable = false;
      return false;
    }

    // Init Web Engine
    async function initWebEngineIfNeeded() {
      if (state.webTtsInstance || state.webLoading) return;
      state.webLoading = true;
      els.statusBadge.className = 'status-badge loading';
      els.statusText.textContent = 'Cargando ONNX Web…';

      try {
        state.webTtsInstance = await TinyVoca.create({
          modelPath: '/dist/models/tiny-voca/model.onnx',
          phonemizerPath: '/dist/models/tiny-voca/phonemizer/lexicon.tsv',
          configPath: '/dist/models/tiny-voca/config.json',
          wasmPath: '/dist/onnxruntime-web/',
        });
        state.webLoading = false;
        els.statusBadge.className = 'status-badge';
        els.statusText.textContent = 'Web ONNX Listo';
        showToast('Modelo Web ONNX listo', 'success');
      } catch (err) {
        console.error('[WebTTS Error]:', err);
        state.webLoading = false;
        els.statusBadge.className = 'status-badge error';
        els.statusText.textContent = 'Error modelo Web';
        showToast('Error cargando modelo Web: ' + err.message, 'danger');
      }
    }

    // Waveform Drawing
    function drawIdleWaveform() {
      const canvas = els.waveCanvas;
      const dpr = window.devicePixelRatio || 1;
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      if (!w || !h) return;

      canvas.width = w * dpr;
      canvas.height = h * dpr;
      const ctx = canvas.getContext('2d');
      ctx.scale(dpr, dpr);

      ctx.clearRect(0, 0, w, h);
      ctx.strokeStyle = 'rgba(124, 92, 255, 0.2)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(0, h / 2);
      ctx.lineTo(w, h / 2);
      ctx.stroke();

      const numBars = Math.floor(w / 6);
      for (let i = 0; i < numBars; i++) {
        const barH = 3 + Math.sin(i * 0.18) * 3;
        const x = i * 6 + 2;
        ctx.fillStyle = 'rgba(255, 255, 255, 0.04)';
        ctx.fillRect(x, (h - barH) / 2, 3, barH);
      }
    }

    function renderAudioEnvelope(samples) {
      const canvas = els.waveCanvas;
      const dpr = window.devicePixelRatio || 1;
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      if (!w || !h || !samples) return;

      canvas.width = w * dpr;
      canvas.height = h * dpr;
      const ctx = canvas.getContext('2d');
      ctx.scale(dpr, dpr);

      ctx.clearRect(0, 0, w, h);

      const numBars = Math.floor(w / 5);
      const step = Math.floor(samples.length / numBars);
      const barW = 3;
      const midY = h / 2;

      for (let i = 0; i < numBars; i++) {
        let max = 0;
        const start = i * step;
        const end = Math.min(start + step, samples.length);
        for (let j = start; j < end; j++) {
          const v = Math.abs(samples[j]);
          if (v > max) max = v;
        }

        const barH = Math.max(3, max * (h * 0.88));
        const x = i * 5 + 1;
        const y = midY - barH / 2;

        const grad = ctx.createLinearGradient(0, y, 0, y + barH);
        grad.addColorStop(0, 'rgba(124, 92, 255, 0.9)');
        grad.addColorStop(1, 'rgba(6, 182, 212, 0.7)');

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.roundRect(x, y, barW, barH, 1.5);
        ctx.fill();
      }
    }

    // Playback Engine
    function stopPlayback() {
      if (audioSourceNode) {
        try { audioSourceNode.stop(); audioSourceNode.disconnect(); } catch (e) {}
        audioSourceNode = null;
      }
      if (animFrameId) {
        cancelAnimationFrame(animFrameId);
        animFrameId = null;
      }
      state.isPlaying = false;
      state.pauseOffset = 0;
      els.playIcon.style.display = 'block';
      els.pauseIcon.style.display = 'none';
      els.waveformCursor.style.width = '0%';
      els.timeCurrent.textContent = '00:00.0';
      if (state.audioSamples) {
        renderAudioEnvelope(state.audioSamples);
      } else {
        drawIdleWaveform();
      }
    }

    function startPlayback(offsetSeconds = 0) {
      if (!state.audioBuffer) return;
      const ctx = getAudioContext();

      if (audioSourceNode) {
        try { audioSourceNode.stop(); audioSourceNode.disconnect(); } catch (e) {}
      }

      audioSourceNode = ctx.createBufferSource();
      audioSourceNode.buffer = state.audioBuffer;
      audioSourceNode.connect(analyserNode);
      analyserNode.connect(ctx.destination);

      state.startTime = ctx.currentTime - offsetSeconds;
      state.pauseOffset = offsetSeconds;
      audioSourceNode.start(0, offsetSeconds);
      state.isPlaying = true;

      els.playIcon.style.display = 'none';
      els.pauseIcon.style.display = 'block';

      audioSourceNode.onended = () => {
        if (state.isPlaying) stopPlayback();
      };

      animatePlayback();
    }

    function pausePlayback() {
      if (!state.isPlaying) return;
      const ctx = getAudioContext();
      state.pauseOffset = ctx.currentTime - state.startTime;
      if (audioSourceNode) {
        try { audioSourceNode.stop(); audioSourceNode.disconnect(); } catch (e) {}
        audioSourceNode = null;
      }
      if (animFrameId) {
        cancelAnimationFrame(animFrameId);
        animFrameId = null;
      }
      state.isPlaying = false;
      els.playIcon.style.display = 'block';
      els.pauseIcon.style.display = 'none';
    }

    function togglePlayPause() {
      if (!state.audioBuffer) return;
      if (state.isPlaying) {
        pausePlayback();
      } else {
        const offset = state.pauseOffset >= state.duration ? 0 : state.pauseOffset;
        startPlayback(offset);
      }
    }

    els.btnPlayPause.onclick = togglePlayPause;
    els.btnStop.onclick = stopPlayback;

    els.waveformBox.onclick = (e) => {
      if (!state.audioBuffer || !state.duration) return;
      const rect = els.waveformBox.getBoundingClientRect();
      const frac = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      const targetSec = frac * state.duration;

      if (state.isPlaying) {
        startPlayback(targetSec);
      } else {
        state.pauseOffset = targetSec;
        els.waveformCursor.style.width = (frac * 100) + '%';
        els.timeCurrent.textContent = fmtTime(targetSec);
      }
    };

    function animatePlayback() {
      if (!state.isPlaying) return;
      const ctx = getAudioContext();
      const current = ctx.currentTime - state.startTime;

      if (current >= state.duration) {
        stopPlayback();
        return;
      }

      const progressFrac = Math.min(1, current / state.duration);
      els.waveformCursor.style.width = (progressFrac * 100) + '%';
      els.timeCurrent.textContent = fmtTime(current);

      animFrameId = requestAnimationFrame(animatePlayback);
    }

    // Synthesis Trigger
    els.btnGenerate.onclick = async () => {
      const text = els.textInput.value.trim();
      if (!text) {
        showToast('Escribe texto para generar', 'danger');
        els.textInput.focus();
        return;
      }

      getAudioContext();

      state.isSynthesizing = true;
      els.btnGenerate.disabled = true;
      els.btnIcon.style.display = 'none';
      els.btnSpinner.style.display = 'inline-block';
      els.btnLabel.textContent = 'Sintetizando…';
      els.statusBadge.className = 'status-badge loading';
      els.statusText.textContent = state.mode === 'bun' ? 'Bun sintetizando…' : 'ONNX Web infiriendo…';

      stopPlayback();

      try {
        if (state.mode === 'bun') {
          await synthesizeViaBun(text);
        } else {
          await synthesizeViaWeb(text);
        }
        els.statusBadge.className = 'status-badge';
        els.statusText.textContent = 'Listo';
      } catch (err) {
        console.error('[Synthesize Error]:', err);
        showToast('Error: ' + err.message, 'danger');
        els.statusBadge.className = 'status-badge error';
        els.statusText.textContent = 'Error';
      } finally {
        state.isSynthesizing = false;
        els.btnGenerate.disabled = false;
        els.btnIcon.style.display = 'inline-block';
        els.btnSpinner.style.display = 'none';
        els.btnLabel.textContent = 'Generar Audio';
      }
    };

    // Mode 1: Bun
    async function synthesizeViaBun(text) {
      const t0 = performance.now();
      const res = await fetch('/api/synthesize', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          text,
          voice: state.voice,
          speed: state.speed,
          pitch_shift: state.pitchShift,
          pitch_range: state.pitchRange,
        }),
      });

      if (!res.ok) {
        const errJson = await res.json().catch(() => ({}));
        throw new Error(errJson.error || `HTTP ${res.status}`);
      }

      const clientLatency = performance.now() - t0;
      const wavArrayBuffer = await res.arrayBuffer();

      const serverInferenceMs = parseFloat(res.headers.get('X-Inference-Ms')) || clientLatency;
      const audioSeconds = parseFloat(res.headers.get('X-Audio-Seconds')) || (wavArrayBuffer.byteLength / 48000);
      const rtf = parseFloat(res.headers.get('X-RTF')) || (serverInferenceMs / 1000 / audioSeconds);
      const respVoice = res.headers.get('X-Voice') || state.voice;

      const ctx = getAudioContext();
      const decodedBuffer = await ctx.decodeAudioData(wavArrayBuffer.slice(0));

      const samples = decodedBuffer.getChannelData(0);
      state.audioSamples = samples;
      state.audioBuffer = decodedBuffer;
      state.duration = decodedBuffer.duration;

      const wavBlob = new Blob([wavArrayBuffer], { type: 'audio/wav' });
      if (state.audioUrl) URL.revokeObjectURL(state.audioUrl);
      state.audioUrl = URL.createObjectURL(wavBlob);

      updatePlayerMonitor({
        voice: respVoice,
        engine: '⚡ Bun API',
        inferenceMs: serverInferenceMs,
        audioSeconds: state.duration,
        rtf: rtf,
        words: text.trim().split(/\s+/).length,
      });

      showToast(`Audio generado en ${serverInferenceMs.toFixed(0)} ms (Bun)`, 'success');
      startPlayback(0);
    }

    // Mode 2: Web Client
    async function synthesizeViaWeb(text) {
      if (!state.webTtsInstance) {
        await initWebEngineIfNeeded();
      }

      if (!state.webTtsInstance) {
        throw new Error('No se pudo inicializar la librería Web de ONNX');
      }

      const res = await state.webTtsInstance.synthesize({
        text,
        voice: state.voice,
        speed: state.speed,
        pitchShift: state.pitchShift,
        pitchRange: state.pitchRange,
      });

      const ctx = getAudioContext();

      let maxPeak = 0;
      for (let i = 0; i < res.audio.length; i++) {
        const v = Math.abs(res.audio[i]);
        if (v > maxPeak) maxPeak = v;
      }
      const gain = maxPeak > 0 ? Math.min(1.0, 0.95 / maxPeak) : 1.0;

      const audioBuffer = ctx.createBuffer(1, res.audio.length, res.sampleRate);
      const channelData = audioBuffer.getChannelData(0);
      for (let i = 0; i < res.audio.length; i++) {
        channelData[i] = res.audio[i] * gain;
      }

      state.audioSamples = channelData;
      state.audioBuffer = audioBuffer;
      state.duration = audioBuffer.duration;

      const wavBytes = encodeWav(res.audio, { sampleRate: res.sampleRate, peak: 0.95 });
      const wavBlob = new Blob([wavBytes.buffer], { type: 'audio/wav' });
      if (state.audioUrl) URL.revokeObjectURL(state.audioUrl);
      state.audioUrl = URL.createObjectURL(wavBlob);

      updatePlayerMonitor({
        voice: state.voice,
        engine: '🌐 Web ONNX',
        inferenceMs: res.inferenceMs,
        audioSeconds: res.audioSeconds,
        rtf: res.rtf,
        words: text.trim().split(/\s+/).length,
      });

      showToast(`Audio generado en ${res.inferenceMs.toFixed(0)} ms (Web)`, 'success');
      startPlayback(0);
    }

    function updatePlayerMonitor(meta) {
      els.tagVoice.textContent = meta.voice;
      els.tagEngine.textContent = meta.engine;
      els.audioSummary.textContent = `${meta.audioSeconds.toFixed(2)}s · 24 kHz · Mono`;

      els.timeCurrent.textContent = '00:00.0';
      els.timeTotal.textContent = fmtTime(meta.audioSeconds);

      els.mInference.textContent = `${meta.inferenceMs.toFixed(0)} ms`;
      els.mRTF.textContent = `${meta.rtf.toFixed(3)}×`;
      els.mDuration.textContent = `${meta.audioSeconds.toFixed(2)} s`;
      els.mTokens.textContent = `${meta.words} p`;

      els.btnDownload.onclick = () => {
        if (!state.audioUrl) return;
        const a = document.createElement('a');
        a.href = state.audioUrl;
        a.download = `fast-tiny-tts-${meta.voice.toLowerCase()}-${Date.now()}.wav`;
        a.click();
        showToast('Descargando archivo WAV...', 'info');
      };

      els.nativeAudio.src = state.audioUrl;
      renderAudioEnvelope(state.audioSamples);
    }

    // Keyboard Shortcuts
    window.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        els.btnGenerate.click();
      }
      if (e.code === 'Space' && document.activeElement !== els.textInput) {
        e.preventDefault();
        togglePlayPause();
      }
      if (e.key === 'Escape') {
        stopPlayback();
      }
    });

    window.addEventListener('resize', () => {
      if (state.audioSamples) {
        renderAudioEnvelope(state.audioSamples);
      } else {
        drawIdleWaveform();
      }
    });

    // Startup
    async function initApp() {
      const bunOnline = await checkBunServer();
      if (bunOnline) {
        setEngineMode('bun');
      } else {
        setEngineMode('web');
      }
      drawIdleWaveform();
    }

    initApp();
  </script>
</body>
</html>
